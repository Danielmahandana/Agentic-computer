[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-agent"
version = "0.1.0"
description = "A learn-by-building browser computer and agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "groq>=0.11",
    "httpx>=0.28,<1",
    "playwright>=1.55",
    "pydantic>=2.11",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "httpx2>=0.1",
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
